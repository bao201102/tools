server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Global security headers (applied to general files like robots.txt)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. SPA fallback. `$uri/` resolves the prerendered per-route pages written by
    #    scripts/prerender.js (e.g. /json -> /json/index.html), each carrying its
    #    own title/description/canonical. /index.html remains the last resort.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. HTML is never cached — covers /index.html and every prerendered route so
    #    a deploy is visible on the next request.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 3. The service worker and version manifest must always be revalidated,
    #    otherwise clients can pin themselves to an old build indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 4. Cache hashed static assets (JS/CSS/images) for 1 year and duplicated security headers
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 5. The web manifest is small and changes rarely, but must not be pinned for
    #    a year like the hashed assets above.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
